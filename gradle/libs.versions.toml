# 依存の唯一の宣言点（JAV/QLT: 版はここ以外に書かない）
[versions]
java = "21"
errorprone-plugin = "5.1.1"
spotless-plugin = "8.10.1"
forbiddenapis-plugin = "3.10"
errorprone = "2.50.0"
nullaway = "0.14.1"
jspecify = "1.0.1"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.0"
checkstyle = "14.1.0"
palantir-java-format = "2.97.0"

[libraries]
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-plugin" }
forbiddenapis = { id = "de.thetaphi.forbiddenapis", version.ref = "forbiddenapis-plugin" }
