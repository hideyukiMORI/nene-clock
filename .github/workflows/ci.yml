# QLT-001 / QLT-005: CI は品質判断を持たない。ローカルと同じ `./gradlew check` を呼ぶだけ。
name: CI

on:
  # 完了の判定はここ。PR に対して 1 回だけ全件を回す（QLT-001 / QLT-013）。
  pull_request:
  # merge 後の main。ゲートではなく、次の PR のためにビルドキャッシュを温めるための実行。
  # PR で検証済みの木と同じ内容を回し直すだけになる変更（文書・ライセンス）では回さない。
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Run the canonical gate
        run: ./gradlew check --stacktrace

      - name: Fail if the working tree drifted
        run: git diff --exit-code
