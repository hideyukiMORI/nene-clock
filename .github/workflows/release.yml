# QLT-001 / QLT-005: 配布の手順は Gradle task（packageInstaller）に閉じる。
# ここは各 OS のランナーで同じ task を呼び、できたものを置くだけ。品質判断は持たない（ADR 0013 / 0015）。
name: Release

# 🔑 配布物は 1 回だけ作る（ADR 0022）。GitHub Release は**作り直さず**、Store に出した MSIX を作った実行の
#    成果物をそのまま添付する。だからタグでは起動しない。タグは release ジョブが、その実行の commit に打つ。
on:
  workflow_dispatch:
    inputs:
      publish_from_run:
        description: "この実行 ID の成果物を GitHub Release に出す（作り直さない）。空なら配布物を作るだけ"
        required: false
        default: ""
      dry_run:
        description: "true なら確かめるだけで、タグも Release も作らない"
        type: boolean
        required: false
        default: true
  # 配布の結線に触る PR では、マージ前に各 OS で配布物ができることを確かめる。
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/build.gradle.kts"
      - "app/src/main/java/io/github/hideyukimori/neneclock/app/AppIconFiles.java"
      - "app/src/main/java/io/github/hideyukimori/neneclock/app/IcoFile.java"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  windows:
    name: windows
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_from_run == '' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true
      # packageMsix は packageInstaller の app-image をそのまま包む（ADR 0020）。作り直さない。
      - name: Build the distributables with the canonical tasks
        run: ./gradlew packageInstaller packageMsix --stacktrace
      - name: Keep them as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nene-clock-windows
          path: |
            app/build/installer/*.msi
            app/build/installer/*.zip
            app/build/installer/*.sha256
          if-no-files-found: error
      # MSIX は Partner Center へ出すもので、GitHub Release には添付しない（Store が署名し直したものが配られる）。
      - name: Keep the Store package as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nene-clock-store-msix
          path: |
            app/build/msix/*.msix
            app/build/msix/*.sha256
          if-no-files-found: error

  linux:
    name: linux
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true
      - name: Make sure the .deb tooling is present
        run: sudo apt-get install -y --no-install-recommends fakeroot dpkg-dev
      - name: Build the distributables with the canonical task
        run: ./gradlew packageInstaller --stacktrace
      - name: Keep them as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nene-clock-linux
          path: |
            app/build/installer/*.deb
            app/build/installer/*.zip
            app/build/installer/*.sha256
          if-no-files-found: error

  # 配るのは Windows のポータブル zip と MSI、Ubuntu の .deb（ADR 0013 / 0015）。MSIX は Store が配るので添付しない。
  # 🔴 ここでは何も作らない。渡された実行の成果物を確かめて、そのまま出す（ADR 0022）。
  release:
    name: release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_from_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish the artifacts of the submitted run, unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.publish_from_run }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in ''|*[!0-9]*) echo "publish_from_run must be a run id (digits only): $RUN_ID"; exit 1;; esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          path=$(jq -r .path <<<"$run"); conclusion=$(jq -r .conclusion <<<"$run"); sha=$(jq -r .head_sha <<<"$run")
          echo "run $RUN_ID: $path / $conclusion / $sha"
          [ "$path" = ".github/workflows/release.yml" ] || { echo "that run is not a Release run"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "that run did not succeed"; exit 1; }
          # main に載っている commit だけを出す（PR の枝で作ったものを出さない）。
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" -q .status)
          case "$status" in identical|ahead) ;; *) echo "commit $sha is not on main (compare status: $status)"; exit 1;; esac
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist
          # 作ったときに書いた .sha256 と、いまの中身が同じであることを確かめる。
          for directory in dist/nene-clock-windows dist/nene-clock-linux dist/nene-clock-store-msix; do
            (cd "$directory" && for sum in *.sha256; do sha256sum --check --strict "$sum"; done)
          done
          # Store に出せない版（先頭が 0）の実行は、Release にも出さない。
          [ -f dist/nene-clock-store-msix/NeNe-Clock-store.msix ] || { echo "that run has no submittable MSIX"; exit 1; }
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/gradle.properties?ref=$sha" -q .content | base64 --decode | sed -n 's/^version=//p')
          tag="v$version"
          echo "would publish $tag at $sha:"; ls -l dist/nene-clock-windows dist/nene-clock-linux
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release $tag already exists"; exit 1; fi
          if [ "$DRY_RUN" != "false" ]; then echo "dry run: nothing was tagged or published"; exit 0; fi
          gh release create "$tag" --target "$sha" \
            dist/nene-clock-windows/*-windows-portable.zip dist/nene-clock-windows/*-windows-portable.zip.sha256 \
            dist/nene-clock-windows/*.msi dist/nene-clock-windows/*.msi.sha256 \
            dist/nene-clock-linux/*.deb dist/nene-clock-linux/*.deb.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "NeNe Clock $tag" --generate-notes
