# QLT-001 / QLT-005: 配布の手順は Gradle task（packageInstaller）に閉じる。
# ここは各 OS のランナーで同じ task を呼び、できたものを置くだけ。品質判断は持たない（ADR 0013 / 0015）。
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # 配布の結線に触る PR では、マージ前に各 OS で配布物ができることを確かめる。
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/build.gradle.kts"
      - "app/src/main/java/io/github/hideyukimori/neneclock/app/AppIconFiles.java"
      - "app/src/main/java/io/github/hideyukimori/neneclock/app/IcoFile.java"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true
      - name: Build the distributables with the canonical task
        run: ./gradlew packageInstaller --stacktrace
      # 一時的な探針（#107）。ランナーで app-image を MSIX に包めるかを測る。測ったら消す。
      - name: PROBE (temporary, #107) wrap the app-image into an MSIX
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits\10\bin'
          Get-ChildItem $kits -Directory | Where-Object Name -like '10.*' | ForEach-Object {
            "$($_.Name) makeappx=$(Test-Path "$($_.FullName)\x64\makeappx.exe") makepri=$(Test-Path "$($_.FullName)\x64\makepri.exe") signtool=$(Test-Path "$($_.FullName)\x64\signtool.exe")"
          }
          "on PATH: makeappx=$([bool](Get-Command makeappx.exe -ErrorAction SilentlyContinue)) makepri=$([bool](Get-Command makepri.exe -ErrorAction SilentlyContinue))"
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          $sdk = Get-ChildItem $kits -Directory | Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          "using $($sdk.FullName)"
          $layout = 'app\build\msix-probe\layout'
          New-Item -ItemType Directory -Force (Split-Path $layout) | Out-Null
          Copy-Item 'app\build\installer\image\NeNe Clock' $layout -Recurse
          New-Item -ItemType Directory "$layout\Assets" | Out-Null
          foreach ($name in 'StoreLogo','Square150x150Logo','Square44x44Logo') { Copy-Item 'app\build\icons\nene-clock-256.png' "$layout\Assets\$name.png" }
          $manifest = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" IgnorableNamespaces="uap rescap">
            <Identity Name="NeNeClock.CiProbe" Publisher="CN=NeNe Clock CI Probe" Version="0.2.6.0" ProcessorArchitecture="x64" />
            <Properties><DisplayName>NeNe Clock probe</DisplayName><PublisherDisplayName>probe</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>
            <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.19041.0" MaxVersionTested="10.0.26100.0" /></Dependencies>
            <Resources><Resource Language="en-us" /></Resources>
            <Applications><Application Id="NeNeClock" Executable="NeNe Clock.exe" EntryPoint="Windows.FullTrustApplication"><uap:VisualElements DisplayName="NeNe Clock probe" Description="probe" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" /></Application></Applications>
            <Capabilities><rescap:Capability Name="runFullTrust" /></Capabilities>
          </Package>
          '@ -replace '(?m)^\s+', ''
          [IO.File]::WriteAllText("$PWD\$layout\AppxManifest.xml", $manifest, [Text.UTF8Encoding]::new($false))
          & "$($sdk.FullName)\x64\makepri.exe" createconfig /cf app\build\msix-probe\priconfig.xml /dq en-US /pv 10.0.0 /o | Select-Object -Last 2
          "makepri createconfig exit=$LASTEXITCODE"
          & "$($sdk.FullName)\x64\makeappx.exe" pack /o /d $layout /p app\build\msix-probe\probe.msix | Select-Object -Last 3
          "makeappx exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw 'makeappx failed' }
          "msix bytes: $((Get-Item app\build\msix-probe\probe.msix).Length)"
      - name: Keep them as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nene-clock-windows
          path: |
            app/build/installer/*.msi
            app/build/installer/*.zip
            app/build/installer/*.sha256
          if-no-files-found: error

  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          validate-wrappers: true
      - name: Make sure the .deb tooling is present
        run: sudo apt-get install -y --no-install-recommends fakeroot dpkg-dev
      - name: Build the distributables with the canonical task
        run: ./gradlew packageInstaller --stacktrace
      - name: Keep them as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nene-clock-linux
          path: |
            app/build/installer/*.deb
            app/build/installer/*.zip
            app/build/installer/*.sha256
          if-no-files-found: error

  # 配るのは Windows のポータブル zip と MSI、Ubuntu の .deb。
  # MSI は #70 の時点で未検証だったので外していたが、2026-09-05 に施主の Windows 実機で入ることを
  # 確かめたので載せる（gate-proofs 20.5 / ADR 0013 / #86）。
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/nene-clock-windows/*-windows-portable.zip dist/nene-clock-windows/*-windows-portable.zip.sha256
          dist/nene-clock-windows/*.msi dist/nene-clock-windows/*.msi.sha256
          dist/nene-clock-linux/*.deb dist/nene-clock-linux/*.deb.sha256
          --repo "$GITHUB_REPOSITORY" --title "NeNe Clock $GITHUB_REF_NAME" --generate-notes
